<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase Admin Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0B2850, #2474C6);
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 { color: #164B8C; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #B9D2ED;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #164B8C;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>EventEase Admin</h2>
        <p>Login to view customer enquiries</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="password" name="password"
                   placeholder="Enter admin password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
