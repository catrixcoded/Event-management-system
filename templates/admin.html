
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <h2>EventEase Admin</h2>
    <a href="/">Home</a>
    <a href="/events">Events</a>
    <a href="/register">Register</a>
</nav>

<h1 class="page-title">Admin Dashboard</h1>

<h2 class="page-title">Registered Participants</h2>

<div class="table-container">

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Event</th>
    </tr>

    {% for person in registrations %}

    <tr>
        <td>{{ person[0] }}</td>
        <td>{{ person[1] }}</td>
        <td>{{ person[2] }}</td>
        <td>{{ person[3] }}</td>
    </tr>

    {% endfor %}

</table>

</div>

</body>
</html>
